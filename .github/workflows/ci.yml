name: CI/CD

# Pull requests: checks only. Push to main: checks, then images to ghcr.io, then deploy.
# Deploy stays off until the repo variable DEPLOY_ENABLED is "true" (see docs/deploy.md).
on:
  pull_request:
  push:
    branches: [main]

# Actions are pinned to commit SHAs (a tag can be moved by whoever controls the action repo).
# Dependabot proposes updates as pull requests.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest

  poller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/poller
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/poller/requirements.txt
      - run: pip install -r requirements.txt pytest ruff mypy bandit types-requests
      - run: bash lint.sh

  ws-subscriber:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ws-subscriber
    env:
      DOCKER_HOST: unix:///var/run/docker.sock  # Testcontainers uses the runner's Docker, not podman
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: bash lint.sh

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secret-scan, poller, ws-subscriber]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [poller, ws-subscriber]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"  # ghcr needs lowercase
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/polydetector-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/polydetector-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: images
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts  # pinned host key, no blind trust
          # The key's forced command on the server runs scripts/deploy.sh with this sha.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$USER@$HOST" "$GITHUB_SHA"

# Works with `podman compose` and `docker compose`.
# Credentials come only from .env (see .env.example); compose refuses to start if they are missing.
# This file runs prebuilt images (server). Locally, docker-compose.override.yaml is merged in
# automatically and builds from source instead.

x-db-env: &db-env
  TIMESCALE_HOST: timescaledb
  TIMESCALE_PORT: 5432
  TIMESCALE_DB: ${TIMESCALE_DB:?set TIMESCALE_DB in .env}
  TIMESCALE_USER: ${TIMESCALE_USER:?set TIMESCALE_USER in .env}
  TIMESCALE_PASS: ${TIMESCALE_PASS:?set TIMESCALE_PASS in .env}
  CLOSING_WINDOW_HOURS: ${CLOSING_WINDOW_HOURS:-24}
  CLOSING_GRACE_HOURS: ${CLOSING_GRACE_HOURS:-6}

services:
  timescaledb:
    image: docker.io/timescale/timescaledb:2.26.1-pg16  # pinned: a deploy must never upgrade the DB by surprise
    ports:
      - "127.0.0.1:5432:5432"  # localhost only; on the VPS use an SSH tunnel
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:?set TIMESCALE_DB in .env}
      POSTGRES_USER: ${TIMESCALE_USER:?set TIMESCALE_USER in .env}
      POSTGRES_PASSWORD: ${TIMESCALE_PASS:?set TIMESCALE_PASS in .env}
    volumes:
      # Named volume by default. On the server set TIMESCALE_DATA_DIR to a path on the block storage.
      - ${TIMESCALE_DATA_DIR:-timescale_data}:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - polydetector

  poller:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/polydetector-poller:${IMAGE_TAG:-latest}
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      <<: *db-env
      TAG_IDS_PATH: /data/tag_ids.json
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      TRADE_BACKFILL_HOURS: ${TRADE_BACKFILL_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./tag_ids.json:/data/tag_ids.json:ro,Z
    restart: unless-stopped
    networks:
      - polydetector

  ws-subscriber:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/polydetector-ws-subscriber:${IMAGE_TAG:-latest}
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      <<: *db-env
      SPIKE_WINDOW_MINUTES: ${SPIKE_WINDOW_MINUTES:-5}
      SPIKE_HISTORY_MINUTES: ${SPIKE_HISTORY_MINUTES:-60}
      SPIKE_FACTOR: ${SPIKE_FACTOR:-5}
      SPIKE_MIN_NOTIONAL: ${SPIKE_MIN_NOTIONAL:-1000}
    restart: unless-stopped
    networks:
      - polydetector

networks:
  polydetector:
    driver: bridge

volumes:
  timescale_data:
